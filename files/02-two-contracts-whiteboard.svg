<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="Caveat, 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', cursive">
<defs>
  <filter id="r1" x="-6%" y="-6%" width="112%" height="112%">
    <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="3" seed="19" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="r2" x="-6%" y="-6%" width="112%" height="112%">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="6" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs>

<rect width="900" height="620" fill="#fbfbf7"/>

<g filter="url(#r2)">
  <text x="42" y="50" font-size="31" fill="#22252b">Two contracts, one broker</text>
  <path d="M43 62 Q180 68 372 60" stroke="#2c7fb8" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <text x="42" y="88" font-size="19" fill="#6a6f78">neither side knows the other exists</text>
</g>

<!-- consumers row -->
<g filter="url(#r1)" stroke="#6a6f78" stroke-width="2.2" fill="none" stroke-linecap="round">
  <path d="M52 118 L214 115 L216 168 L54 171 Z"/>
  <path d="M240 118 L402 115 L404 168 L242 171 Z"/>
  <path d="M428 118 L590 115 L592 168 L430 171 Z"/>
  <path d="M616 118 L778 115 L780 168 L618 171 Z"/>
</g>
<g filter="url(#r2)" font-size="17" fill="#3d4148">
  <text x="70" y="141">Identity provider</text><text x="70" y="162" font-size="14" fill="#8a8f98">JWT signing</text>
  <text x="258" y="141">Service mesh</text><text x="258" y="162" font-size="14" fill="#8a8f98">mTLS identity</text>
  <text x="446" y="141">Build pipeline</text><text x="446" y="162" font-size="14" fill="#8a8f98">artifact signing</text>
  <text x="634" y="141">Records store</text><text x="634" y="162" font-size="14" fill="#8a8f98">field encryption</text>
</g>

<!-- north contract band -->
<g filter="url(#r1)" stroke="#2c7fb8" stroke-width="3" fill="none" stroke-linecap="round">
  <path d="M52 212 L848 208 L850 288 L54 292 Z"/>
</g>
<g filter="url(#r2)">
  <text x="72" y="240" font-size="22" fill="#2c7fb8">NORTH CONTRACT</text>
  <text x="72" y="242" font-size="22" fill="#2c7fb8" opacity="0"> </text>
  <text x="270" y="240" font-size="20" fill="#22252b">Consumer API</text>
  <text x="72" y="270" font-size="16" fill="#3d4148">GenerateKeyPair · Sign · Verify · Encapsulate · Decapsulate · Derive · Wrap · GetCapabilities · ResolvePolicy</text>
  <text x="700" y="240" font-size="15" fill="#8a8f98">stable, additive only</text>
</g>

<!-- arrows -->
<g filter="url(#r1)" stroke="#8a8f98" stroke-width="2.2" fill="none" stroke-linecap="round">
  <path d="M133 172 L133 206"/><path d="M127 198 L133 208 L139 198"/>
  <path d="M321 172 L321 206"/><path d="M315 198 L321 208 L327 198"/>
  <path d="M509 172 L509 206"/><path d="M503 198 L509 208 L515 198"/>
  <path d="M697 172 L697 206"/><path d="M691 198 L697 208 L703 198"/>
</g>

<!-- broker -->
<g filter="url(#r1)" stroke="#22252b" stroke-width="3.4" fill="none" stroke-linecap="round">
  <path d="M290 320 L612 316 L615 402 L292 406 Z"/>
  <path d="M294 324 L608 320 L611 398 L296 402 Z" opacity="0.35"/>
</g>
<g filter="url(#r2)">
  <text x="452" y="352" font-size="25" fill="#22252b" text-anchor="middle">BROKER CORE</text>
  <text x="452" y="379" font-size="17" fill="#6a6f78" text-anchor="middle">route · resolve · orchestrate · audit</text>
</g>
<g filter="url(#r1)" stroke="#8a8f98" stroke-width="2.2" fill="none" stroke-linecap="round">
  <path d="M452 292 L452 314"/><path d="M446 306 L452 316 L458 306"/>
  <path d="M452 406 L452 428"/><path d="M446 420 L452 430 L458 420"/>
</g>

<!-- south contract band -->
<g filter="url(#r1)" stroke="#1f8a5f" stroke-width="3" fill="none" stroke-linecap="round">
  <path d="M52 434 L848 430 L850 510 L54 514 Z"/>
</g>
<g filter="url(#r2)">
  <text x="72" y="462" font-size="22" fill="#1f8a5f">SOUTH CONTRACT</text>
  <text x="270" y="462" font-size="20" fill="#22252b">Provider SPI</text>
  <text x="72" y="492" font-size="16" fill="#3d4148">describe_capabilities · keygen · sign · verify · encaps · decaps · derive · wrap · attest</text>
  <text x="700" y="462" font-size="15" fill="#8a8f98">any backend, hot-swap</text>
</g>

<!-- providers -->
<g filter="url(#r1)" stroke="#6a6f78" stroke-width="2.2" fill="none" stroke-linecap="round">
  <path d="M52 546 L214 543 L216 596 L54 599 Z"/>
  <path d="M240 546 L402 543 L404 596 L242 599 Z"/>
  <path d="M428 546 L590 543 L592 596 L430 599 Z"/>
  <path d="M616 546 L778 543 L780 596 L618 599 Z"/>
</g>
<g filter="url(#r2)" font-size="17" fill="#3d4148">
  <text x="70" y="569">liboqs</text><text x="70" y="590" font-size="14" fill="#8a8f98">ML-DSA, ML-KEM</text>
  <text x="258" y="569">Network HSM</text><text x="258" y="590" font-size="14" fill="#8a8f98">via PKCS#11</text>
  <text x="446" y="569">Cloud KMS</text><text x="446" y="590" font-size="14" fill="#8a8f98">AWS, Azure, GCP</text>
  <text x="634" y="569">TPM 2.0</text><text x="634" y="590" font-size="14" fill="#8a8f98">platform root</text>
</g>

<!-- side note -->
<g filter="url(#r2)">
  <path d="M800 340 Q862 356 806 392" stroke="#e0673a" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <text x="640" y="330" font-size="16" fill="#e0673a">only stateful piece</text>
  <text x="640" y="418" font-size="16" fill="#e0673a">on the hot path</text>
</g>
</svg>
