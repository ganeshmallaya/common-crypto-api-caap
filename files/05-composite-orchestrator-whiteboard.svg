<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="Caveat, 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', cursive">
<defs>
  <filter id="r1" x="-6%" y="-6%" width="112%" height="112%">
    <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="3" seed="41" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="r2" x="-6%" y="-6%" width="112%" height="112%">
    <feTurbulence type="fractalNoise" baseFrequency="0.036" numOctaves="2" seed="17" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="1.3" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs>

<rect width="900" height="620" fill="#fbfbf7"/>

<g filter="url(#r2)">
  <text x="40" y="48" font-size="29" fill="#22252b">Composite orchestrator: hybrid as one operation</text>
  <path d="M41 60 Q260 66 596 58" stroke="#e0673a" stroke-width="3.4" fill="none" stroke-linecap="round"/>
  <text x="40" y="84" font-size="18" fill="#6a6f78">the part PKCS#11 cannot express and the IBM design leaves open</text>
</g>

<!-- caller -->
<g filter="url(#r1)" stroke="#7c5cbf" stroke-width="2.6" fill="none" stroke-linecap="round">
  <path d="M300 110 L600 106 L603 172 L302 176 Z"/>
</g>
<g filter="url(#r2)">
  <text x="450" y="136" font-size="19" fill="#7c5cbf" text-anchor="middle">caller: sign(handle, payload)</text>
  <text x="450" y="160" font-size="15" fill="#8a8f98" text-anchor="middle">one call, no knowledge of hybrid</text>
</g>

<g filter="url(#r1)" stroke="#8a8f98" stroke-width="2.2" fill="none" stroke-linecap="round">
  <path d="M450 176 L450 204"/><path d="M444 196 L450 206 L456 196"/>
</g>

<!-- orchestrator -->
<g filter="url(#r1)" stroke="#e0673a" stroke-width="3.2" fill="none" stroke-linecap="round">
  <path d="M250 208 L650 204 L653 288 L252 292 Z"/>
  <path d="M254 212 L646 208 L649 284 L256 288 Z" opacity="0.35"/>
</g>
<g filter="url(#r2)">
  <text x="450" y="238" font-size="21" fill="#e0673a" text-anchor="middle">COMPOSITE ORCHESTRATOR</text>
  <text x="450" y="262" font-size="15" fill="#6a6f78" text-anchor="middle">resolves id-composite-ecdsa-mldsa65</text>
  <text x="450" y="281" font-size="14" fill="#8a8f98" text-anchor="middle">reads constituents and combiner from the registry</text>
</g>

<!-- dispatch arrows -->
<g filter="url(#r1)" stroke="#8a8f98" stroke-width="2.2" fill="none" stroke-linecap="round">
  <path d="M370 292 L216 336"/><path d="M226 326 L212 338 L228 342"/>
  <path d="M530 292 L684 336"/><path d="M674 326 L688 338 L672 342"/>
</g>
<g filter="url(#r2)" font-size="14" fill="#8a8f98">
  <text x="212" y="316">primitive 1</text>
  <text x="618" y="316">primitive 2</text>
</g>

<!-- two providers -->
<g filter="url(#r1)" stroke="#1f8a5f" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-dasharray="7 5">
  <path d="M60 344 L340 340 L343 424 L62 428 Z"/>
</g>
<g filter="url(#r1)" stroke="#1f8a5f" stroke-width="2.6" fill="none" stroke-linecap="round">
  <path d="M560 344 L840 340 L843 424 L562 428 Z"/>
</g>
<g filter="url(#r2)">
  <text x="200" y="372" font-size="18" fill="#1f8a5f" text-anchor="middle">Network HSM</text>
  <text x="200" y="394" font-size="15" fill="#3d4148" text-anchor="middle">ECDSA P-256</text>
  <text x="200" y="416" font-size="13" fill="#8a8f98" text-anchor="middle">FIPS validated, hardware</text>

  <text x="700" y="372" font-size="18" fill="#1f8a5f" text-anchor="middle">liboqs software</text>
  <text x="700" y="394" font-size="15" fill="#3d4148" text-anchor="middle">ML-DSA-65</text>
  <text x="700" y="416" font-size="13" fill="#8a8f98" text-anchor="middle">no HSM firmware wait</text>
</g>

<!-- combiner -->
<g filter="url(#r1)" stroke="#8a8f98" stroke-width="2.2" fill="none" stroke-linecap="round">
  <path d="M216 428 L400 470"/><path d="M390 460 L404 472 L388 476"/>
  <path d="M684 428 L500 470"/><path d="M510 460 L496 472 L512 476"/>
</g>
<g filter="url(#r1)" stroke="#22252b" stroke-width="2.8" fill="none" stroke-linecap="round">
  <path d="M300 478 L600 474 L603 540 L302 544 Z"/>
</g>
<g filter="url(#r2)">
  <text x="450" y="504" font-size="19" fill="#22252b" text-anchor="middle">registered combiner</text>
  <text x="450" y="528" font-size="15" fill="#6a6f78" text-anchor="middle">byte encoding fixed by registry entry</text>
</g>
<g filter="url(#r1)" stroke="#8a8f98" stroke-width="2.2" fill="none" stroke-linecap="round">
  <path d="M450 544 L450 570"/><path d="M444 562 L450 572 L456 562"/>
</g>
<g filter="url(#r2)">
  <text x="450" y="596" font-size="19" fill="#1f8a5f" text-anchor="middle">one signature returned to the caller</text>
</g>

<!-- annotation -->
<g filter="url(#r2)">
  <path d="M60 470 Q120 490 90 520" stroke="#e0673a" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <text x="60" y="464" font-size="15" fill="#e0673a">hardware and software</text>
  <text x="60" y="546" font-size="15" fill="#e0673a">in one operation</text>
  <text x="60" y="566" font-size="15" fill="#e0673a">is the whole point</text>
</g>
</svg>
