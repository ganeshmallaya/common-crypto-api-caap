<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" font-family="Caveat, 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', cursive">
<defs>
  <filter id="r1" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="3" seed="33" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="3.1" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="r2" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.036" numOctaves="2" seed="14" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="1.3" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs>

<rect width="1000" height="700" fill="#fbfbf7"/>

<g filter="url(#r2)">
  <text x="40" y="48" font-size="30" fill="#22252b">Access token signing: ES256 to hybrid ECDSA plus ML-DSA</text>
  <path d="M41 60 Q320 66 700 58" stroke="#2c7fb8" stroke-width="3.4" fill="none" stroke-linecap="round"/>
  <text x="40" y="84" font-size="18" fill="#6a6f78">one identity provider, 66 call sites, 4 relying party groups</text>
</g>

<!-- divider -->
<g filter="url(#r1)" stroke="#c9cdd4" stroke-width="2" fill="none" stroke-dasharray="9 7">
  <path d="M500 104 L500 620"/>
</g>

<!-- ================= BEFORE ================= -->
<g filter="url(#r2)">
  <text x="40" y="132" font-size="24" fill="#c0392b">WITHOUT the broker</text>
  <path d="M41 142 Q140 148 262 140" stroke="#c0392b" stroke-width="3" fill="none" stroke-linecap="round"/>
</g>

<g filter="url(#r1)" stroke="#c0392b" stroke-width="2.4" fill="none" stroke-linecap="round">
  <path d="M40 162 L464 158 L467 246 L42 250 Z"/>
</g>
<g filter="url(#r2)" font-size="15" fill="#8a1f14">
  <text x="58" y="186">var alg = SignatureAlgorithm.ES256;</text>
  <text x="58" y="208">var jws = Jwts.builder()</text>
  <text x="58" y="230">    .signWith(privateKey, alg).compact();</text>
</g>
<g filter="url(#r2)">
  <text x="58" y="272" font-size="15" fill="#6a6f78">Six decisions live in that call: curve, hash,</text>
  <text x="58" y="292" font-size="15" fill="#6a6f78">encoding, key format, header value, library.</text>
</g>

<g filter="url(#r1)" stroke="#e0a39b" stroke-width="2" fill="none">
  <path d="M40 316 L464 312 L467 604 L42 608 Z"/>
</g>
<g filter="url(#r2)" font-size="16" fill="#3d4148">
  <text x="58" y="344" font-size="17" fill="#c0392b">What the migration costs</text>
  <text x="58" y="376">1. Edit 66 call sites across 6 services.</text>
  <text x="58" y="404">2. Add a library that speaks ML-DSA.</text>
  <text x="58" y="432">3. Grow the JWKS payload from 0.6 KB to 8 KB.</text>
  <text x="58" y="460">4. Rewrite header handling for a composite alg.</text>
  <text x="58" y="488">5. Coordinate 4 relying party groups.</text>
  <text x="58" y="516">6. Build 6 deploys and 6 rollback plans.</text>
  <text x="58" y="544">7. Repeat all of it for the next algorithm.</text>
</g>
<g filter="url(#r1)" stroke="#c0392b" stroke-width="2.8" fill="none">
  <ellipse cx="252" cy="578" rx="150" ry="20"/>
</g>
<g filter="url(#r2)">
  <text x="252" y="584" font-size="19" fill="#c0392b" text-anchor="middle">3 quarters of engineering</text>
</g>

<!-- ================= AFTER ================= -->
<g filter="url(#r2)">
  <text x="536" y="132" font-size="24" fill="#1f8a5f">WITH the broker</text>
  <path d="M537 142 Q620 148 738 140" stroke="#1f8a5f" stroke-width="3" fill="none" stroke-linecap="round"/>
</g>

<g filter="url(#r1)" stroke="#1f8a5f" stroke-width="2.4" fill="none" stroke-linecap="round">
  <path d="M536 162 L960 158 L963 246 L538 250 Z"/>
</g>
<g filter="url(#r2)" font-size="15" fill="#155f42">
  <text x="554" y="186">var jws = crypto.sign(</text>
  <text x="554" y="208">    handle("idp-access-token"),</text>
  <text x="554" y="230">    payload);</text>
</g>
<g filter="url(#r2)">
  <text x="554" y="272" font-size="15" fill="#6a6f78">Zero decisions in the call. The handle carries</text>
  <text x="554" y="292" font-size="15" fill="#6a6f78">the algorithm. Policy decides what that is.</text>
</g>

<g filter="url(#r1)" stroke="#9fcdb8" stroke-width="2" fill="none">
  <path d="M536 316 L960 312 L963 604 L538 608 Z"/>
</g>
<g filter="url(#r2)" font-size="16" fill="#3d4148">
  <text x="554" y="344" font-size="17" fill="#1f8a5f">What the migration costs</text>
  <text x="554" y="376">1. Edit one policy profile.</text>
  <text x="554" y="404">2. Sign the profile.</text>
  <text x="554" y="432">3. Publish it.</text>
</g>
<g filter="url(#r1)" stroke="#a08b6a" stroke-width="2" fill="none" stroke-dasharray="6 5">
  <path d="M554 452 L944 449 L945 546 L555 549 Z"/>
</g>
<g filter="url(#r2)" font-size="15" fill="#a08b6a">
  <text x="570" y="476" font-size="16">Still real work, and the draft says so:</text>
  <text x="570" y="500">Relying parties must verify the new algorithm</text>
  <text x="570" y="522">first. The broker moves the cost. It does not</text>
  <text x="570" y="540">delete it. Verify side leads, sign side follows.</text>
</g>
<g filter="url(#r1)" stroke="#1f8a5f" stroke-width="2.8" fill="none">
  <ellipse cx="748" cy="578" rx="150" ry="20"/>
</g>
<g filter="url(#r2)">
  <text x="748" y="584" font-size="19" fill="#1f8a5f" text-anchor="middle">one afternoon, per algorithm</text>
</g>

<!-- bottom line -->
<g filter="url(#r2)">
  <path d="M40 640 L960 636" stroke="#c9cdd4" stroke-width="2" fill="none"/>
  <text x="40" y="668" font-size="18" fill="#3d4148">The broker does not make cryptography easier. It makes the second migration cost</text>
  <text x="40" y="692" font-size="18" fill="#3d4148">almost nothing, which is the only property that matters after 2030.</text>
</g>
</svg>
