<svg viewBox="0 0 940 640" xmlns="http://www.w3.org/2000/svg" font-family="Caveat, 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', cursive">
<defs>
  <filter id="r1" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="3" seed="61" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="3.1" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="r2" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.036" numOctaves="2" seed="29" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="1.3" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs>

<rect width="940" height="640" fill="#fbfbf7"/>

<g filter="url(#r2)">
  <text x="40" y="48" font-size="28" fill="#22252b">Where three efforts sit in the same stack</text>
  <path d="M41 60 Q240 66 520 58" stroke="#2c7fb8" stroke-width="3.4" fill="none" stroke-linecap="round"/>
  <text x="40" y="84" font-size="17" fill="#6a6f78">none of the three cites the others, and all three appeared within twelve months</text>
</g>

<!-- layer bands -->
<g filter="url(#r1)" stroke="#c9cdd4" stroke-width="2" fill="none" stroke-dasharray="8 6">
  <path d="M40 110 L900 106"/>
  <path d="M40 224 L900 220"/>
  <path d="M40 338 L900 334"/>
  <path d="M40 452 L900 448"/>
</g>
<g filter="url(#r2)" font-size="15" fill="#a8adb5">
  <text x="46" y="130">governance and migration program</text>
  <text x="46" y="244">policy and control plane</text>
  <text x="46" y="358">operation API and provider contract</text>
  <text x="46" y="472">conformance, IDL, test vectors</text>
</g>

<!-- CCP column -->
<g filter="url(#r1)" stroke="#8f9aa8" stroke-width="2.6" fill="none" stroke-linecap="round">
  <path d="M300 116 L470 112 L473 330 L302 334 Z"/>
</g>
<g filter="url(#r2)">
  <text x="386" y="142" font-size="19" fill="#22252b" text-anchor="middle">CCP Standard</text>
  <text x="386" y="164" font-size="13" fill="#8a8f98" text-anchor="middle">v0.9, one vendor</text>
  <text x="386" y="200" font-size="14" fill="#3d4148" text-anchor="middle">CAPA pillars</text>
  <text x="386" y="224" font-size="14" fill="#3d4148" text-anchor="middle">six maturity levels</text>
  <text x="386" y="252" font-size="14" fill="#3d4148" text-anchor="middle">four migration phases</text>
  <text x="386" y="276" font-size="14" fill="#3d4148" text-anchor="middle">key ID abstraction</text>
  <text x="386" y="308" font-size="13" fill="#c0392b" text-anchor="middle">API named as</text>
  <text x="386" y="326" font-size="13" fill="#c0392b" text-anchor="middle">open question #1</text>
</g>
<g filter="url(#r1)" stroke="#c0392b" stroke-width="2.2" fill="none" stroke-dasharray="6 5">
  <path d="M386 340 L386 468"/>
</g>
<g filter="url(#r2)">
  <text x="392" y="410" font-size="13" fill="#c0392b">no IDL</text>
  <text x="392" y="430" font-size="13" fill="#c0392b">no vectors</text>
</g>

<!-- IBM column -->
<g filter="url(#r1)" stroke="#8f9aa8" stroke-width="2.6" fill="none" stroke-linecap="round">
  <path d="M500 230 L670 226 L673 444 L502 448 Z"/>
</g>
<g filter="url(#r2)">
  <text x="586" y="256" font-size="19" fill="#22252b" text-anchor="middle">IBM papers</text>
  <text x="586" y="278" font-size="13" fill="#8a8f98" text-anchor="middle">2606.13425, 2606.13445</text>
  <text x="586" y="314" font-size="14" fill="#3d4148" text-anchor="middle">seven dimensions</text>
  <text x="586" y="338" font-size="14" fill="#3d4148" text-anchor="middle">six systems scored</text>
  <text x="586" y="362" font-size="14" fill="#3d4148" text-anchor="middle">scope vocabulary</text>
  <text x="586" y="386" font-size="14" fill="#3d4148" text-anchor="middle">TransformKey, MigrateKey</text>
  <text x="586" y="410" font-size="14" fill="#3d4148" text-anchor="middle">protobuf patterns</text>
  <text x="586" y="438" font-size="13" fill="#c0392b" text-anchor="middle">no hybrid, no shim</text>
</g>

<!-- ours column -->
<g filter="url(#r1)" stroke="#e0673a" stroke-width="3.2" fill="none" stroke-linecap="round">
  <path d="M700 116 L892 112 L895 560 L702 564 Z"/>
  <path d="M704 120 L888 116 L891 556 L706 560 Z" opacity="0.3"/>
</g>
<g filter="url(#r2)">
  <text x="796" y="142" font-size="19" fill="#e0673a" text-anchor="middle">Common Crypto API</text>
  <text x="796" y="164" font-size="13" fill="#8a8f98" text-anchor="middle">this work</text>
  <text x="796" y="200" font-size="14" fill="#3d4148" text-anchor="middle">governance split</text>
  <text x="796" y="224" font-size="14" fill="#3d4148" text-anchor="middle">across three bodies</text>
  <text x="796" y="256" font-size="14" fill="#3d4148" text-anchor="middle">signed policy profiles</text>
  <text x="796" y="280" font-size="14" fill="#3d4148" text-anchor="middle">downgrade rejection</text>
  <text x="796" y="312" font-size="14" fill="#3d4148" text-anchor="middle">north and south</text>
  <text x="796" y="334" font-size="14" fill="#3d4148" text-anchor="middle">contracts named</text>
  <text x="796" y="366" font-size="14" fill="#e0673a" text-anchor="middle">composite orchestrator</text>
  <text x="796" y="390" font-size="14" fill="#e0673a" text-anchor="middle">PKCS#11 shim</text>
  <text x="796" y="422" font-size="14" fill="#3d4148" text-anchor="middle">IDL is normative</text>
  <text x="796" y="446" font-size="14" fill="#3d4148" text-anchor="middle">test vectors required</text>
  <text x="796" y="470" font-size="14" fill="#3d4148" text-anchor="middle">three conformance levels</text>
  <text x="796" y="502" font-size="14" fill="#3d4148" text-anchor="middle">hard boundary stated</text>
  <text x="796" y="526" font-size="13" fill="#8a8f98" text-anchor="middle">constrained devices</text>
  <text x="796" y="544" font-size="13" fill="#8a8f98" text-anchor="middle">excluded on purpose</text>
</g>

<!-- annotation -->
<g filter="url(#r2)">
  <path d="M690 340 Q660 350 676 366" stroke="#e0673a" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <text x="200" y="500" font-size="17" fill="#e0673a">Two gaps belong to nobody else: hybrid as a first-class operation,</text>
  <text x="200" y="524" font-size="17" fill="#e0673a">and a compatibility path for the crypto already in production.</text>
</g>

<g filter="url(#r2)">
  <path d="M40 578 L900 574" stroke="#c9cdd4" stroke-width="2" fill="none"/>
  <text x="40" y="606" font-size="17" fill="#3d4148">CCP defers the API. The IBM papers defer the orchestration and the hybrid path.</text>
  <text x="40" y="630" font-size="17" fill="#3d4148">This draft claims the seam between them, and says out loud where it does not reach.</text>
</g>
</svg>
