<!-- hard boundary note -->
<g filter="url(#r1)" stroke="#a08b6a" stroke-width="2.4" fill="none" stroke-linecap="round">
  <path d="M40 652 L962 648 L965 748 L42 752 Z"/>
</g>
<g filter="url(#r2)">
  <text x="60" y="680" font-size="18" fill="#a08b6a">HARD BOUNDARY — what this architecture does not cover</text>
  <text x="60" y="708" font-size="16" fill="#3d4148">A 32 KB microcontroller cannot host a broker. A measured boot root cannot call a policy service.</text>
  <text x="60" y="732" font-size="16" fill="#3d4148">A line-rate MACsec datapath cannot afford the hop. Those algorithms stay fixed at build time.</text>
</g>

<g filter="url(#r2)">
  <text x="40" y="792" font-size="17" fill="#6a6f78">Consumers depend only on the north contract. Backends satisfy only the south contract.</text>
  <text x="40" y="816" font-size="17" fill="#6a6f78">New algorithms and new hardware reach production without a consumer code change.</text>
  <text x="40" y="844" font-size="14" fill="#a8adb5">Common Crypto API · reference architecture · draft rev 02 · anchored in NIST CSWP 39</text>
</g>
</svg>
