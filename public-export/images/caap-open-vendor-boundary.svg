<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">CAAP open contract and vendor implementation boundary</title>
  <desc id="desc">The open CAAP core standardizes operation, decision, provider, error, evidence, and conformance semantics while vendors differentiate through products and operating capabilities.</desc>
  <defs>
    <filter id="rough" x="-3%" y="-4%" width="106%" height="108%"><feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="33" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/></filter>
    <style>
      text{font-family:"Trebuchet MS","Segoe UI",sans-serif}.hand{font-family:"Comic Sans MS","Bradley Hand",cursive}
      .ink{fill:#20262e}.muted{fill:#687381}.blue{fill:#176b87}.orange{fill:#b65d2f}
      .open{fill:#f2f8fa;stroke:#176b87;stroke-width:3;rx:16}.vendor{fill:#fff7ee;stroke:#b65d2f;stroke-width:3;rx:16}
      .pill{fill:#fffdf8;stroke:#7c8793;stroke-width:2;rx:10}
    </style>
  </defs>
  <rect width="1200" height="675" fill="#fbfaf5"/>
  <g filter="url(#rough)">
    <text x="52" y="59" class="ink hand" font-size="34">Standardize the seam. Compete on the system.</text>
    <path d="M53 72 Q340 80 748 70" stroke="#176b87" stroke-width="4" fill="none" stroke-linecap="round"/>
    <text x="52" y="102" class="muted" font-size="18">A common interface reduces integration friction without turning every implementation into the same product.</text>

    <rect x="52" y="140" width="514" height="460" class="open"/>
    <text x="309" y="181" text-anchor="middle" class="blue" font-size="26">Open CAAP contract</text>
    <text x="309" y="211" text-anchor="middle" class="muted" font-size="16">portable and independently testable</text>
    <rect x="85" y="245" width="210" height="67" class="pill"/><rect x="323" y="245" width="210" height="67" class="pill"/>
    <rect x="85" y="335" width="210" height="67" class="pill"/><rect x="323" y="335" width="210" height="67" class="pill"/>
    <rect x="85" y="425" width="210" height="67" class="pill"/><rect x="323" y="425" width="210" height="67" class="pill"/>
    <rect x="169" y="515" width="280" height="53" class="pill"/>
    <text x="190" y="274" text-anchor="middle" class="ink" font-size="17">Consumer operations</text><text x="190" y="296" text-anchor="middle" class="muted" font-size="14">intent + typed inputs</text>
    <text x="428" y="274" text-anchor="middle" class="ink" font-size="17">Policy decisions</text><text x="428" y="296" text-anchor="middle" class="muted" font-size="14">version + provenance</text>
    <text x="190" y="364" text-anchor="middle" class="ink" font-size="17">Provider SPI</text><text x="190" y="386" text-anchor="middle" class="muted" font-size="14">capability + execution</text>
    <text x="428" y="364" text-anchor="middle" class="ink" font-size="17">Failure model</text><text x="428" y="386" text-anchor="middle" class="muted" font-size="14">no silent fallback</text>
    <text x="190" y="454" text-anchor="middle" class="ink" font-size="17">Evidence envelope</text><text x="190" y="476" text-anchor="middle" class="muted" font-size="14">what ran and why</text>
    <text x="428" y="454" text-anchor="middle" class="ink" font-size="17">Adapter profiles</text><text x="428" y="476" text-anchor="middle" class="muted" font-size="14">PKCS#11 · KMIP</text>
    <text x="309" y="548" text-anchor="middle" class="ink" font-size="17">Vectors + conformance tests</text>

    <rect x="634" y="140" width="514" height="460" class="vendor"/>
    <text x="891" y="181" text-anchor="middle" class="orange" font-size="26">Vendor implementation</text>
    <text x="891" y="211" text-anchor="middle" class="muted" font-size="16">where products create value</text>
    <rect x="667" y="245" width="210" height="67" class="pill"/><rect x="905" y="245" width="210" height="67" class="pill"/>
    <rect x="667" y="335" width="210" height="67" class="pill"/><rect x="905" y="335" width="210" height="67" class="pill"/>
    <rect x="667" y="425" width="210" height="67" class="pill"/><rect x="905" y="425" width="210" height="67" class="pill"/>
    <rect x="751" y="515" width="280" height="53" class="pill"/>
    <text x="772" y="274" text-anchor="middle" class="ink" font-size="17">Policy products</text><text x="772" y="296" text-anchor="middle" class="muted" font-size="14">authoring · approvals</text>
    <text x="1010" y="274" text-anchor="middle" class="ink" font-size="17">SDKs and adapters</text><text x="1010" y="296" text-anchor="middle" class="muted" font-size="14">developer reach</text>
    <text x="772" y="364" text-anchor="middle" class="ink" font-size="17">Performance</text><text x="772" y="386" text-anchor="middle" class="muted" font-size="14">routing · caching</text>
    <text x="1010" y="364" text-anchor="middle" class="ink" font-size="17">Reliability</text><text x="1010" y="386" text-anchor="middle" class="muted" font-size="14">scale · availability</text>
    <text x="772" y="454" text-anchor="middle" class="ink" font-size="17">Custody and assurance</text><text x="772" y="476" text-anchor="middle" class="muted" font-size="14">hardware · attestation</text>
    <text x="1010" y="454" text-anchor="middle" class="ink" font-size="17">Operations</text><text x="1010" y="476" text-anchor="middle" class="muted" font-size="14">analytics · support</text>
    <text x="891" y="548" text-anchor="middle" class="ink" font-size="17">Managed services + ecosystem</text>
  </g>
  <text x="600" y="642" text-anchor="middle" class="muted" font-size="17">Interoperability is shared. Product outcomes remain competitive.</text>
</svg>
