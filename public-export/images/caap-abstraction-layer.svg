<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">CAAP cryptographic abstraction layer</title>
  <desc id="desc">Applications call a Common Crypto API. A broker enforces a separate policy decision and dispatches through a provider interface to software, PKCS11, KMIP, cloud KMS, and platform key stores.</desc>
  <defs>
    <filter id="rough" x="-4%" y="-6%" width="108%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="21" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#55606f"/>
    </marker>
    <style>
      .ink{fill:#20262e}.muted{fill:#667180}.blue{fill:#176b87}.green{fill:#2b7a55}.red{fill:#a33a32}
      .line{fill:none;stroke:#55606f;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .box{fill:#fffdf7;stroke:#303843;stroke-width:3;rx:12}.soft{fill:#f4f8f8;stroke:#176b87;stroke-width:3;rx:12}
      .provider{fill:#f3f8f2;stroke:#2b7a55;stroke-width:3;rx:12}.policy{fill:#fff5f1;stroke:#a33a32;stroke-width:3;rx:12}
      text{font-family:"Trebuchet MS","Segoe UI",sans-serif}.hand{font-family:"Comic Sans MS","Bradley Hand",cursive}
    </style>
  </defs>
  <rect width="1200" height="675" fill="#fbfaf5"/>
  <g filter="url(#rough)">
    <text x="56" y="61" class="ink hand" font-size="34">CAAP: the cryptographic abstraction layer</text>
    <path d="M57 74 Q360 82 689 72" stroke="#176b87" stroke-width="4" fill="none" stroke-linecap="round"/>
    <text x="56" y="101" class="muted" font-size="18">Applications say what operation they need. Providers decide how to execute only after a policy decision.</text>

    <rect x="55" y="144" width="218" height="118" class="box"/>
    <text x="164" y="177" text-anchor="middle" class="ink" font-size="22">Consumers</text>
    <text x="164" y="207" text-anchor="middle" class="muted" font-size="16">services · pipelines</text>
    <text x="164" y="232" text-anchor="middle" class="muted" font-size="16">PKI · data systems</text>

    <rect x="340" y="144" width="255" height="118" class="soft"/>
    <text x="468" y="177" text-anchor="middle" class="blue" font-size="22">Common Crypto API</text>
    <text x="468" y="207" text-anchor="middle" class="ink" font-size="16">operation + intent</text>
    <text x="468" y="232" text-anchor="middle" class="ink" font-size="16">typed input + constraints</text>

    <rect x="662" y="144" width="218" height="118" class="box"/>
    <text x="771" y="177" text-anchor="middle" class="ink" font-size="22">Broker</text>
    <text x="771" y="207" text-anchor="middle" class="muted" font-size="16">validate · match</text>
    <text x="771" y="232" text-anchor="middle" class="muted" font-size="16">dispatch · evidence</text>

    <rect x="947" y="144" width="198" height="118" class="policy"/>
    <text x="1046" y="177" text-anchor="middle" class="red" font-size="21">Policy authority</text>
    <text x="1046" y="207" text-anchor="middle" class="ink" font-size="16">one decision</text>
    <text x="1046" y="232" text-anchor="middle" class="ink" font-size="16">or one rejection</text>

    <path d="M274 202 L333 202" class="line" marker-end="url(#arrow)"/>
    <path d="M596 202 L655 202" class="line" marker-end="url(#arrow)"/>
    <path d="M886 201 L940 201" class="line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

    <rect x="422" y="331" width="350" height="92" class="provider"/>
    <text x="597" y="366" text-anchor="middle" class="green" font-size="23">Provider SPI</text>
    <text x="597" y="396" text-anchor="middle" class="ink" font-size="16">concrete operation + resolved requirements</text>
    <path d="M771 270 Q770 310 706 330" class="line" marker-end="url(#arrow)"/>

    <rect x="55" y="501" width="188" height="93" class="box"/>
    <rect x="275" y="501" width="188" height="93" class="box"/>
    <rect x="495" y="501" width="188" height="93" class="box"/>
    <rect x="715" y="501" width="188" height="93" class="box"/>
    <rect x="935" y="501" width="210" height="93" class="box"/>
    <text x="149" y="539" text-anchor="middle" class="ink" font-size="20">Software</text>
    <text x="149" y="568" text-anchor="middle" class="muted" font-size="15">library provider</text>
    <text x="369" y="539" text-anchor="middle" class="ink" font-size="20">PKCS#11</text>
    <text x="369" y="568" text-anchor="middle" class="muted" font-size="15">token or HSM</text>
    <text x="589" y="539" text-anchor="middle" class="ink" font-size="20">KMIP</text>
    <text x="589" y="568" text-anchor="middle" class="muted" font-size="15">managed objects</text>
    <text x="809" y="539" text-anchor="middle" class="ink" font-size="20">Cloud KMS</text>
    <text x="809" y="568" text-anchor="middle" class="muted" font-size="15">service API</text>
    <text x="1040" y="539" text-anchor="middle" class="ink" font-size="20">Platform key store</text>
    <text x="1040" y="568" text-anchor="middle" class="muted" font-size="15">native boundary</text>

    <path d="M597 428 L597 468" class="line"/>
    <path d="M149 468 L1040 468" class="line"/>
    <path d="M149 468 L149 494" class="line" marker-end="url(#arrow)"/>
    <path d="M369 468 L369 494" class="line" marker-end="url(#arrow)"/>
    <path d="M589 468 L589 494" class="line" marker-end="url(#arrow)"/>
    <path d="M809 468 L809 494" class="line" marker-end="url(#arrow)"/>
    <path d="M1040 468 L1040 494" class="line" marker-end="url(#arrow)"/>
  </g>
  <text x="56" y="644" class="muted" font-size="16">Open contracts preserve operation semantics. Implementations compete on policy, adapters, assurance, performance, and operations.</text>
</svg>
